name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build
        run: ./mvnw clean compile

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: productcatalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_PASSWORD: root
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AUTH_SERVICE_URL: http://localhost:8081
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Test
        run: ./mvnw test

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: productcatalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_PASSWORD: root
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AUTH_SERVICE_URL: http://localhost:8081
      CATALOG_URL: http://localhost:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build artifact
        run: ./mvnw package -DskipTests

      - name: Start Product Catalog
        run: |
          java -jar target/ProductCatalog-0.0.1-SNAPSHOT.jar > catalog.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/products > /dev/null 2>&1; then
              echo "Product catalog is up after ${i} attempt(s)"
              exit 0
            fi
            kill -0 $APP_PID 2>/dev/null || { tail -100 catalog.log; exit 1; }
            sleep 5
          done
          echo "Timed out waiting for product catalog to start"
          tail -100 catalog.log
          exit 1

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Run smoke test via OpenCode agent
        run: |
          opencode run \
            --agent build \
            --model llama-3.3-70b-versatile \
            --auto \
            -f requests.md \
            "Write smoke.sh: a bash script under 40 lines that runs the attached requests in order with curl against AUTH_URL and CATALOG_URL(env variable). Use only curl and sed. Print PASS or FAIL with the request number and status cods. keep it simple don't run it."
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build artifact
        run: ./mvnw package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-catalog
          path: target/ProductCatalog-0.0.1-SNAPSHOT.jar
          retention-days: 7

      - name: Copy artifact to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "target/ProductCatalog-0.0.1-SNAPSHOT.jar"
          target: "/opt/shopnest"

      - name: Restart application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/shopnest
            sudo systemctl restart shopnest
